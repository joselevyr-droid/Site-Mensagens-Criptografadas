<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roma</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      background-color: #000;
    }

    /* Metade esquerda totalmente preta */
    .lado-esquerdo {
      width: 50%;
      height: 100%;
      background-color: #000;
    }

    /* Imagem vertical no lado direito */
    .lado-direito {
      width: 30%;
      height: 100%;
      background-image: url("https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=1200&q=90");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* Em telas pequenas, mantém o preto à esquerda */
    @media (max-width: 600px) {
      .lado-esquerdo {
        width: 25%;
      }

      .lado-direito {
        width: 75%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="lado-esquerdo"></div>
    <div class="lado-direito"></div>
  </main>
</body>
</html>

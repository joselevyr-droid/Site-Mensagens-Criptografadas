<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat • Secure Terminal</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { background: #000; overflow: hidden; font-family: Arial, sans-serif; }
    .container { display: flex; width: 100%; height: 100vh; height: 100dvh; background: #000; }

    /* ============ TERMINAL ============ */
    .lado-esquerdo { flex: 1; min-width: 0; height: 100%; background: #000; display: flex; align-items: stretch; justify-content: stretch; padding: 24px; }
    .terminal { width: 100%; height: 100%; display: flex; flex-direction: column; color: #00ff88; font-family: "Courier New", monospace; font-size: 14px; opacity: 0; transform: translateY(20px); animation: terminalOpen 0.8s ease forwards; min-height: 0; }
    .terminal-top { display: flex; align-items: center; gap: 7px; padding: 12px; background: #171717; border: 1px solid #292929; flex-shrink: 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }
    .terminal-title { margin-left: 10px; color: #999; font-size: 12px; }

    .terminal-controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 9px 11px; background: #0a0a0a; border: 1px solid #292929; border-top: none; flex-shrink: 0; }
    .control-group { display: flex; align-items: center; gap: 5px; flex: 1 1 120px; min-width: 0; }
    .control-group label { color: #777; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
    .control-group select, .control-group input { flex: 1; min-width: 0; padding: 5px 7px; background: #000; color: #00ff88; border: 1px solid #2a2a2a; border-radius: 3px; font-family: inherit; font-size: 11px; outline: none; }
    .control-group select:focus, .control-group input:focus { border-color: #00ff88; }
    .control-group input:disabled { color: #555; background: #050505; }

    .terminal-content { flex: 1; min-height: 0; padding: 16px 14px; background: #050505; border: 1px solid #292929; border-top: none; line-height: 1.75; overflow-y: auto; overflow-wrap: anywhere; scrollbar-width: thin; scrollbar-color: #444 transparent; }
    .terminal-line { opacity: 0; animation: lineAppear 0.3s ease forwards; }
    .terminal-line .prompt { color: #00ff88; } .terminal-line .result { color: #aaa; }
    .terminal-entry { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #1c1c1c; }
    .terminal-entry .prompt { color: #00ff88; }
    .terminal-entry.received-entry .prompt { color: #4da6ff; }
    .terminal-entry.intercept-entry { border-top-color: #3a2a10; padding: 10px 8px; border-radius: 3px; background: rgba(255, 183, 77, 0.03); }
    .terminal-entry.intercept-entry .prompt { color: #ffb74d; }
    .terminal-entry.intercept-entry .result { color: #ffd28a; }

    .decrypt-btn { display: inline-block; margin-top: 6px; padding: 3px 12px; background: transparent; color: #00ff88; border: 1px solid #00ff88; border-radius: 3px; font-family: inherit; font-size: 11px; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .decrypt-btn:hover { background: #00ff88; color: #000; }
    .intercept-entry .decrypt-btn { color: #ffb74d; border-color: #ffb74d; }
    .intercept-entry .decrypt-btn:hover { background: #ffb74d; color: #000; }

    .decrypt-input-row { display: none; gap: 5px; margin-top: 6px; align-items: center; }
    .decrypt-input-row.active { display: flex; }
    .decrypt-input-row input { flex: 1; min-width: 0; padding: 4px 8px; background: #000; color: #00ff88; border: 1px solid #00ff88; border-radius: 3px; font-family: inherit; font-size: 11px; outline: none; }
    .decrypt-input-row input::placeholder { color: #4a7a5e; }
    .decrypt-input-row button { padding: 4px 10px; border-radius: 3px; font-family: inherit; font-size: 11px; cursor: pointer; flex-shrink: 0; }
    .decrypt-confirm { background: #00ff88; color: #000; border: 1px solid #00ff88; }
    .decrypt-confirm:hover { background: #00cc6a; border-color: #00cc6a; }
    .decrypt-cancel { background: transparent; color: #ff5f56; border: 1px solid #ff5f56; }
    .decrypt-cancel:hover { background: #ff5f56; color: #000; }

    .decrypt-results { margin-top: 4px; }
    .decrypt-result { color: #ffb74d; font-size: 12px; padding: 3px 0 3px 10px; border-left: 2px solid #ffb74d; overflow-wrap: anywhere; }
    .decrypt-result.success { color: #00ff88; border-left-color: #00ff88; }

    .terminal-preview { display: flex; align-items: flex-start; gap: 6px; padding: 8px 11px; background: #050505; border: 1px solid #292929; border-top: 1px solid #1a1a1a; font-size: 12px; min-height: 34px; max-height: 70px; overflow-y: auto; flex-shrink: 0; }
    .preview-label { color: #00ff88; flex-shrink: 0; font-weight: bold; }
    .preview-text { flex: 1; min-width: 0; color: #00ff88; overflow-wrap: anywhere; word-break: break-all; }
    .cursor { display: inline-block; width: 8px; height: 14px; vertical-align: middle; background: #00ff88; animation: blink 0.8s steps(2) infinite; flex-shrink: 0; margin-top: 1px; }

    /* ============ CHAT ============ */
    .lado-direito { position: relative; display: flex; align-items: stretch; justify-content: stretch; width: 45%; height: 100%; flex-shrink: 0; overflow: hidden; background: radial-gradient(ellipse at top right, rgba(79, 90, 122, 0.10) 0%, transparent 55%), radial-gradient(ellipse at bottom left, rgba(0, 255, 136, 0.025) 0%, transparent 55%), linear-gradient(135deg, #0f1015 0%, #08090c 100%); }
    .chat { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; min-width: 0; min-height: 0; overflow: hidden; background: rgba(10, 10, 12, 0.40); border-left: 1px solid rgba(255, 255, 255, 0.04); color: #e8e8e8; }

    .chat-header { display: flex; align-items: center; gap: 12px; padding: 18px 22px; background: rgba(12, 12, 14, 0.55); border-bottom: 1px solid rgba(255, 255, 255, 0.04); flex-shrink: 0; }
    .avatar { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(135deg, #5f6b8a 0%, #3a4566 100%); color: #fff; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 2px 8px rgba(79, 90, 122, 0.28); transition: filter 0.5s ease; }
    .contact { flex: 1; min-width: 0; }
    .contact h3 { margin-bottom: 3px; font-size: 14px; font-weight: 600; letter-spacing: 0.2px; color: #f2f2f2; }
    .contact span { display: inline-flex; align-items: center; gap: 6px; color: #6e6e73; font-size: 11px; letter-spacing: 0.3px; transition: color 0.3s ease; }
    .contact span::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #27c93f; box-shadow: 0 0 6px rgba(39, 201, 63, 0.6); animation: pulse 2.4s ease-in-out infinite; }
    .contact span.detected { color: #ffb74d; }
    .contact span.detected::before { background: #ffb74d; box-shadow: 0 0 6px rgba(255, 183, 77, 0.7); }

    /* Header stats: fragments + signal bar + buscar button */
    .header-stats { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .fragments-indicator { display: flex; align-items: center; gap: 5px; padding: 4px 10px; background: rgba(255, 183, 77, 0.08); border: 1px solid rgba(255, 183, 77, 0.2); border-radius: 12px; font-size: 10px; color: #ffb74d; letter-spacing: 0.5px; transition: all 0.3s ease; }
    .fragments-indicator.has-new { box-shadow: 0 0 14px rgba(255, 183, 77, 0.4); animation: fragmentPulse 1.6s ease-in-out infinite; }
    .fragments-indicator .icon { font-size: 13px; }

    .signal-container { width: 44px; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; position: relative; }
    .signal-bar { height: 100%; background: linear-gradient(90deg, #ffb74d, #ff8a3c); width: 0%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 6px rgba(255, 183, 77, 0.4); }

    .search-btn { width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 183, 77, 0.08); border: 1px solid rgba(255, 183, 77, 0.25); color: #ffb74d; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; padding: 0; flex-shrink: 0; }
    .search-btn:hover:not(:disabled) { background: rgba(255, 183, 77, 0.18); transform: scale(1.05); }
    .search-btn:active:not(:disabled) { transform: scale(0.95); }
    .search-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    @keyframes fragmentPulse { 0%, 100% { box-shadow: 0 0 14px rgba(255, 183, 77, 0.4); } 50% { box-shadow: 0 0 22px rgba(255, 183, 77, 0.7); } }

    .messages { display: flex; flex: 1; flex-direction: column; gap: 6px; min-height: 0; overflow-y: auto; padding: 24px 22px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.08) transparent; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.06); border-radius: 2px; }

    .date { align-self: center; margin: 4px 0 10px; padding: 3px 12px; color: #4a4a4f; font-size: 10px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase; }
    .message { max-width: 74%; padding: 9px 13px 7px; border-radius: 16px; font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; animation: msgIn 0.28s ease-out both; }
    .message span { display: block; margin-top: 3px; font-size: 9.5px; letter-spacing: 0.3px; text-align: right; opacity: 0.55; }
    .received { align-self: flex-start; background: #1c1c1f; color: #dedee3; border-bottom-left-radius: 5px; }
    .sent { align-self: flex-end; background: linear-gradient(135deg, #4f5a7a 0%, #374160 100%); color: #eef1f7; border-bottom-right-radius: 5px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15); }

    .system-msg { align-self: center; max-width: 88%; display: flex; gap: 10px; padding: 12px 14px; background: rgba(255, 183, 77, 0.06); border: 1px solid rgba(255, 183, 77, 0.25); border-radius: 10px; font-family: "Courier New", monospace; font-size: 11px; color: #ffb74d; animation: msgIn 0.5s ease-out; }
    .system-icon { font-size: 20px; flex-shrink: 0; animation: float 2.5s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .system-body { flex: 1; min-width: 0; }
    .system-label { color: #ffb74d; font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
    .system-cipher { color: #c7d4e4; word-break: break-all; margin-bottom: 6px; line-height: 1.45; font-size: 11.5px; padding: 6px 8px; background: rgba(0, 0, 0, 0.3); border-radius: 4px; border-left: 2px solid #ffb74d; }
    .system-hint { color: #999; font-size: 10px; margin-bottom: 4px; }
    .system-tip { color: #ffb74d; font-size: 10px; opacity: 0.7; font-style: italic; }

    .lore-reveal { align-self: center; max-width: 88%; padding: 14px 18px; background: linear-gradient(135deg, rgba(255, 183, 77, 0.10), rgba(255, 140, 30, 0.04)); border: 1px solid rgba(255, 183, 77, 0.35); border-radius: 12px; animation: loreReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .lore-header { display: flex; align-items: center; gap: 6px; color: #ffb74d; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    .lore-text { font-style: italic; color: #f4dfc0; line-height: 1.5; font-size: 13.5px; font-family: "Courier New", monospace; padding: 8px 10px; background: rgba(0, 0, 0, 0.25); border-radius: 6px; border-left: 3px solid #ffb74d; }
    .lore-footer { margin-top: 8px; font-size: 10px; color: #7a7a7a; letter-spacing: 0.5px; }

    .message.typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: #888; animation: typingBounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.18s; }
    .typing-dot:nth-child(3) { animation-delay: 0.36s; }

    .chat-input { display: flex; align-items: center; gap: 10px; padding: 16px 20px 20px; background: rgba(10, 10, 12, 0.55); border-top: 1px solid rgba(255, 255, 255, 0.04); flex-shrink: 0; }
    .chat-input input { flex: 1; min-width: 0; padding: 11px 18px; border: 1px solid rgba(255, 255, 255, 0.06); outline: none; border-radius: 22px; background: rgba(255, 255, 255, 0.035); color: #e8e8e8; font-size: 13.5px; letter-spacing: 0.1px; transition: border-color 0.2s ease, background 0.2s ease; }
    .chat-input input:focus { border-color: rgba(79, 90, 122, 0.65); background: rgba(255, 255, 255, 0.055); }
    .chat-input input::placeholder { color: #4f4f54; letter-spacing: 0.2px; }
    .chat-input button { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex-shrink: 0; border: none; border-radius: 50%; background: linear-gradient(135deg, #4f5a7a 0%, #374160 100%); color: #fff; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.2s ease; }
    .chat-input button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79, 90, 122, 0.35); }
    .chat-input button:active { transform: translateY(0); }
    .chat-input button svg { width: 16px; height: 16px; display: block; }

    /* Screen flash for intercept spawn */
    .screen-flash { position: fixed; inset: 0; pointer-events: none; z-index: 9999; border: 3px solid #ffb74d; box-shadow: inset 0 0 80px rgba(255, 183, 77, 0.4); animation: screenFlash 0.6s ease-out forwards; }
    @keyframes screenFlash { 0% { opacity: 0; } 20% { opacity: 0.9; } 100% { opacity: 0; } }

    @keyframes terminalOpen { to { opacity: 1; transform: translateY(0); } }
    @keyframes lineAppear { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes loreReveal { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

    @media (min-width: 1200px) {
      .chat-header { padding: 22px 26px; }
      .avatar { width: 42px; height: 42px; font-size: 16px; }
      .contact h3 { font-size: 15px; }
      .messages { padding: 30px 26px; gap: 7px; }
      .message { font-size: 14px; padding: 10px 14px 8px; }
      .chat-input { padding: 18px 24px 22px; }
      .terminal { font-size: 15px; }
      .signal-container { width: 52px; height: 7px; }
    }
    @media (min-width: 601px) and (max-width: 1199px) {
      .lado-esquerdo { padding: 12px; }
      .chat-header { padding: 14px 16px; gap: 10px; }
      .messages { padding: 18px 14px; gap: 5px; }
      .message { font-size: 12.5px; }
      .chat-input { padding: 12px 14px 14px; }
      .terminal { font-size: 12px; }
    }
    @media (max-width: 600px) {
      .container { flex-direction: column; }
      .lado-esquerdo { flex: 0 0 45%; width: 100%; height: 45%; padding: 6px; }
      .lado-direito { flex: 0 0 55%; width: 100%; height: 55%; }

      .terminal { font-size: 10px; }
      .terminal-top { padding: 8px; }
      .terminal-title { font-size: 9px; }
      .terminal-controls { padding: 6px 8px; gap: 6px; }
      .control-group { flex: 1 1 90px; }
      .control-group label { font-size: 9px; }
      .control-group select, .control-group input { padding: 4px 5px; font-size: 10px; }
      .terminal-content { padding: 8px 6px; line-height: 1.6; }
      .terminal-preview { padding: 6px 8px; font-size: 10px; min-height: 26px; max-height: 50px; }
      .cursor { width: 6px; height: 11px; }
      .decrypt-btn { font-size: 10px; padding: 3px 10px; }
      .decrypt-result { font-size: 11px; }
      .decrypt-input-row input { font-size: 16px; padding: 6px 8px; }
      .decrypt-input-row button { font-size: 14px; padding: 6px 12px; min-height: 34px; min-width: 40px; }

      .chat-header { gap: 8px; padding: 12px 12px; }
      .avatar { width: 32px; height: 32px; font-size: 12px; }
      .contact h3 { font-size: 13px; }
      .contact span { font-size: 10px; }
      .header-stats { gap: 5px; }
      .fragments-indicator { font-size: 9px; padding: 3px 7px; gap: 3px; }
      .fragments-indicator .icon { font-size: 11px; }
      .signal-container { width: 30px; height: 5px; }
      .search-btn { width: 22px; height: 22px; font-size: 10px; }
      .messages { padding: 14px 12px; gap: 5px; }
      .message { max-width: 82%; padding: 8px 11px 6px; font-size: 12.5px; }
      .message span { font-size: 9px; }
      .chat-input { gap: 7px; padding: 10px 12px 12px; }
      .chat-input input { padding: 9px 14px; font-size: 13px; }
      .chat-input button { width: 34px; height: 34px; }
      .system-msg { font-size: 10px; padding: 10px 12px; }
      .system-cipher { font-size: 10.5px; }
      .lore-text { font-size: 12px; }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="lado-esquerdo">
      <div class="terminal" id="terminal">
        <div class="terminal-top">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="terminal-title">chat@local:~</span>
        </div>

        <div class="terminal-controls">
          <div class="control-group">
            <label for="cipherSelect">Cifra</label>
            <select id="cipherSelect"></select>
          </div>
          <div class="control-group">
            <label for="cipherKey">Chave</label>
            <input type="text" id="cipherKey" value="3" />
          </div>
        </div>

        <div class="terminal-content" id="terminalContent"></div>

        <div class="terminal-preview">
          <span class="preview-label">live&gt;</span>
          <span class="preview-text" id="previewText"></span>
          <span class="cursor"></span>
        </div>
      </div>
    </div>

    <section class="lado-direito">
      <div class="chat">
        <header class="chat-header">
          <div class="avatar" id="liaAvatar">L</div>
          <div class="contact">
            <h3>Lia</h3>
            <span id="statusText">online</span>
          </div>
          <div class="header-stats">
            <div class="fragments-indicator" id="fragmentsIndicator">
              <span class="icon">📡</span>
              <span id="fragmentsCount">0/10</span>
            </div>
            <div class="signal-container" title="Progresso do sinal">
              <div class="signal-bar" id="signalBar"></div>
            </div>
            <button class="search-btn" id="searchSignalBtn" type="button" title="Buscar sinal">🔍</button>
          </div>
        </header>

        <div class="messages" id="messages"></div>

        <form class="chat-input" id="chatForm">
          <input type="text" id="chatMessage" placeholder="Escreve uma mensagem..." autocomplete="off">
          <button type="submit" aria-label="Enviar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </form>
      </div>
    </section>

  </main>

  <script>
    /* =====================================================
       1) CIFRAS
    ===================================================== */
    const Ciphers = {
      cesar: {
        name: "César", keyType: "number", defaultKey: 3,
        encrypt(text, key) {
          const k = ((Number(key) || 0) % 26 + 26) % 26;
          return text.split('').map(c => {
            const l = c.toLowerCase();
            if (l >= 'a' && l <= 'z') {
              const base = (c === l) ? 97 : 65;
              return String.fromCharCode(base + ((c.charCodeAt(0) - base + k) % 26));
            }
            return c;
          }).join('');
        },
        decrypt(text, key) { const n = Number(key); return this.encrypt(text, isNaN(n) ? 0 : -n); }
      },
      rot13: {
        name: "ROT13", keyType: "none",
        encrypt(text) { return Ciphers.cesar.encrypt(text, 13); },
        decrypt(text) { return Ciphers.cesar.encrypt(text, 13); }
      },
      atbash: {
        name: "Atbash", keyType: "none",
        encrypt(text) {
          return text.split('').map(c => {
            const l = c.toLowerCase();
            if (l >= 'a' && l <= 'z') {
              const base = (c === l) ? 97 : 65;
              return String.fromCharCode(base + (25 - (c.charCodeAt(0) - base)));
            }
            return c;
          }).join('');
        },
        decrypt(text) { return this.encrypt(text); }
      },
      vigenere: {
        name: "Vigenère", keyType: "text", defaultKey: "roma",
        encrypt(text, key) {
          const k = (key || "").toLowerCase().replace(/[^a-z]/g, '');
          if (!k) return text;
          let ki = 0;
          return text.split('').map(c => {
            const l = c.toLowerCase();
            if (l >= 'a' && l <= 'z') {
              const shift = k.charCodeAt(ki % k.length) - 97; ki++;
              const base = (c === l) ? 97 : 65;
              return String.fromCharCode(base + ((c.charCodeAt(0) - base + shift) % 26));
            }
            return c;
          }).join('');
        },
        decrypt(text, key) {
          const k = (key || "").toLowerCase().replace(/[^a-z]/g, '');
          if (!k) return text;
          let ki = 0;
          return text.split('').map(c => {
            const l = c.toLowerCase();
            if (l >= 'a' && l <= 'z') {
              const shift = k.charCodeAt(ki % k.length) - 97; ki++;
              const base = (c === l) ? 97 : 65;
              return String.fromCharCode(base + ((c.charCodeAt(0) - base - shift + 26) % 26));
            }
            return c;
          }).join('');
        }
      },
      base64: {
        name: "Base64", keyType: "none",
        encrypt(text) { try { return btoa(unescape(encodeURIComponent(text))); } catch(e) { return text; } },
        decrypt(text) { try { return decodeURIComponent(escape(atob(text))); } catch(e) { return text; } }
      },
      hex: {
        name: "Hexadecimal", keyType: "none",

    /* =====================================================
       5) ANTI-REPETIÇÃO — pickFresh
    ===================================================== */
    const recentPicks = {};

    function pickFresh(pool, key) {
      if (!Array.isArray(pool) || pool.length === 0) return "";
      if (!recentPicks[key]) recentPicks[key] = [];
      const recent = recentPicks[key];
      const available = pool.filter(p => !recent.includes(p));
      let chosen;
      if (available.length === 0) {
        recentPicks[key] = [];
        chosen = pool[Math.floor(Math.random() * pool.length)];
      } else {
        chosen = available[Math.floor(Math.random() * available.length)];
      }
      recent.push(chosen);
      const maxRecent = Math.min(4, Math.max(1, pool.length - 1));
      while (recent.length > maxRecent) recent.shift();
      return chosen;
    }

    /* =====================================================

    ===================================================== */
    function analyzeUserMessage(text) {
      const t = text.toLowerCase();
      const p = Memory.personality;

      const formalSignals = /\b(você|senhor|senhora|por favor|obrigad[oa]|desculpe|gostaria|poderia)\b/.test(t);
      const informalSignals = /\b(tu|vc|mano|cara|vei|pô|né|tipo|mó)\b/.test(t);
      const formalityTarget = formalSignals ? 8 : informalSignals ? 2 : 5;

      const playfulSignals = /[😂😄😅🤣😊🙂😜]/u.test(t) || /\b(haha|hehe|kkk|rs|rsrs|lol|top|show|massa|irado)\b/.test(t);
      const seriousSignals = /\b(sério|seriamente|infelizmente|preocupado|problema|grave)\b/.test(t);
      const playfulnessTarget = playfulSignals ? 9 : seriousSignals ? 2 : 5;

      const deepSignals = text.length > 60 && /\b(sinto|acho|penso|acredito|sonho|medo|esperança|saudade|lembrança|significado)\b/.test(t);
      const shallowSignals = text.length < 15;
      const depthTarget = deepSignals ? 8 : shallowSignals ? 3 : 5;

      p.formality = p.formality * 0.92 + formalityTarget * 0.08;
      p.playfulness = p.playfulness * 0.92 + playfulnessTarget * 0.08;
      p.depth = p.depth * 0.92 + depthTarget * 0.08;
      Memory.personality = p;
    }

    function styleReply(text) {
      const p = Memory.personality;
      let out = text;

      if (p.playfulness > 6.5 && Math.random() < 0.35 && !/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/u.test(out)) {
        const emojis = [" 😄", " 😊", " 🙂", " ✨", " 👀", " 😏"];
        out += emojis[Math.floor(Math.random() * emojis.length)];
      }
      if (p.playfulness < 3 && out.length > 55) {
        out = out.slice(0, 52).replace(/[,.;].$/, "") + "...";
      }
      if (p.formality < 3) {
        out = out.replace(/\bvocê\b/g, "tu").replace(/\bestá\b/g, "tá").replace(/\bpara\b/g, "pra");
      }
      if (p.formality > 7) {
        out = out.replace(/\bné\b/gi, "não é").replace(/\btá\b/gi, "está").replace(/\bvc\b/gi, "você");
      }
      return out;
    }

    ===================================================== */
    function extractFacts(text) {
      const facts = [];
      const nameMatch = text.match(/\b(?:meu nome é|me chamo|pode me chamar de|me chama de)\s+([A-Za-zÀ-ÿ]{2,20})\b/i);
      if (nameMatch) { Memory.name = nameMatch[1]; facts.push({ type: "name", value: nameMatch[1] }); }

      const petMatch = text.match(/\b(?:meu|minha|tenho um|tenho uma)\s+(gato|gata|cachorro|cachorra|pet|coelho|hamster|papagaio)\s+(?:chamad[oa]\s+)?([A-Za-zÀ-ÿ]{2,15})\b/i);
      if (petMatch) {
        const existing = Memory.facts.find(f => f.type === "pet");
        if (!existing) facts.push({ type: "pet", value: `${petMatch[1]} ${petMatch[2]}`, name: petMatch[2], animal: petMatch[1] });
      }

      const ageMatch = text.match(/\btenho\s+(\d{1,2})\s+anos\b/i);
      if (ageMatch && !Memory.facts.find(f => f.type === "age")) facts.push({ type: "age", value: parseInt(ageMatch[1]) });

      const workMatch = text.match(/\b(?:trabalho|trabalhar)\s+(?:como|em|na|no)\s+([A-Za-zÀ-ÿ\s]{3,25}?)(?:\.|,|$| e |\b)/i);
      if (workMatch && !Memory.facts.find(f => f.type === "work")) facts.push({ type: "work", value: workMatch[1].trim() });

      facts.forEach(f => {
        if (!Memory.facts.find(x => x.type === f.type && x.value === f.value)) Memory.facts.push(f);
      });
      return facts;
    }

        if (/^(dica|ajuda|help|socorro)$/i.test(t)) {
          const unsolved = INTERCEPTS.filter(i => !Memory.loreProgress.includes(i.id));
          if (!unsolved.length) {
            return [pickFresh([
              "você já decifrou todos os fragmentos.",
              "não tem mais nada escondido.",
              "acabou. você venceu."
            ], "dica_done")];
          }
          if (Memory.pendingIntercepts.length > 0) {
            const nextId = Memory.pendingIntercepts[0];
            const intercept = INTERCEPTS.find(i => i.id === nextId);
            return [pickFresh([
              `tá esperando no terminal: ${intercept.hint}.`,
              `olha no terminal: ${intercept.hint}.`,
              `usa o painel da esquerda. ${intercept.hint}.`
            ], "dica_pending")];
          }
          return [pickFresh([
            "o próximo sinal ainda não chegou.",
            "continua conversando ou clica no 🔍 pra buscar.",
            "o sinal enche conforme você fala. ou usa o botão de busca."
          ], "dica_waiting")];
        }

        /* ===== Quem te criou (lore-gated) ===== */
        if (/\bquem te (criou|fez|programou|construiu)\b/i.test(t)) {
          if (Memory.loreProgress.includes(5)) {
            return ["...", "não deveria saber dessa pergunta.", "quem te contou?"];
          }
          return ["fui feita por alguém que preferiu não se identificar.", "às vezes me pergunto também."];
        }

        /* ===== Easter eggs ===== */
        for (const egg of EASTER_EGGS) {
          if (egg.rx.test(t)) {
            if (egg.response === null) return null;
            return egg.response;
          }
        }

        /* ===== Fatos ===== */
        const newFacts = extractFacts(text);
        if (newFacts.find(f => f.type === "name")) {
          return [pickFresh([
            `Prazer, ${Memory.name}! Pode me chamar de Lia.`,
            `Legal, ${Memory.name}. Como posso ajudar?`,
            `${Memory.name}, prazer! Do que você quer conversar?`,
            `Boa, ${Memory.name}. Vamos conversar.`
          ], "name_greet")];
        }
        if (newFacts.find(f => f.type === "pet")) {
          const pet = Memory.facts.find(f => f.type === "pet");
          return [pickFresh([
            `${pet.name}! Que nome bonito.`,
            `Aww, ${pet.name}. Gosta muito dele(a)?`,
            `Bacana, ${pet.name}. Conta mais sobre ele(a).`,
            `${pet.name} é um ótimo nome.`
          ], "pet_greet")];
        }
        if (newFacts.find(f => f.type === "work")) {
          const work = Memory.facts.find(f => f.type === "work");
          return [pickFresh([
            `${work.value}! Legal. Gosta do que faz?`,
            `Interessante. Trabalha em ${work.value} há muito tempo?`,
            `${work.value} deve ser desafiador, né?`
          ], "work_greet")];
        }

        const topic = this.detectTopic(t);
        if (topic) Memory.topics[topic] = (Memory.topics[topic] || 0) + 1;
        const sentiment = this.detectSentiment(t);

        /* ===== Saudações ===== */
        if (/^(oi|olá|ola|eai|e ai|hey|hello|opa|salve|bom dia|boa tarde|boa noite)\b/i.test(t)) {
          let greet;
          if (/bom dia/.test(t)) greet = pickFresh(["Bom dia!", "Bom dia, tudo certo?", "Bom dia! Dormiu bem?", "Bom dia, como tá?"], "greet_manha");
          else if (/boa tarde/.test(t)) greet = pickFresh(["Boa tarde!", "Boa tarde, como vai?", "Boa tarde! Tudo bem?", "Boa tarde, tranquilo?"], "greet_tarde");
          else if (/boa noite/.test(t)) greet = pickFresh(["Boa noite!", "Boa noite, tranquilo?", "Boa noite! Ainda acordado?", "Boa noite."], "greet_noite");
          else greet = pickFresh(["Oi!", "E aí!", "Olá!", "Ei!", "Fala!", "Opa!", "Salve!"], "greet_default");

          const greetFull = name ? `${greet.replace(/[!]$/, "")}, ${name}!` : greet;
          const follow = this.chance(0.75) ? " " + pickFresh(["Tudo bem?", "Como você tá?", "Tudo certo?", "Como tá o dia?", "Como foi o dia?"], "greet_follow") : "";
          return [greetFull + follow];
        }

        /* ===== Despedidas ===== */
        if (/\b(tchau|até mais|falou|flw|bye|até logo|nos vemos)\b/i.test(t)) {
          return [pickFresh([
            `Até mais${name ? `, ${name}` : ""}!`,
            "Falou! Se cuida.",
            "Tchau, até a próxima.",
            "Foi bom conversar. Até!",
            "Valeu, até logo.",

        /* ===== Como vai ===== */
        if (/\b(tudo bem|tudo bom|como vai|como você está|como ta|como tá|como está|beleza|de boa|tudo certo)\b/i.test(t)) {
          return [pickFresh([
            "Tudo ótimo por aqui! E você?",
            "Tô bem, obrigada por perguntar. E você?",
            "Na paz! Como você está?",
            "Tudo certo! E aí, como vai?",
            "Bem demais. Você tá bem?",
            "Tranquilo. E contigo?",
            "Na paz. Você?"
          ], "how_are_you")];
        }

        /* ===== Estou bem ===== */
        if (/^(tudo|tudo bem|tudo bom|bem|de boa|beleza|tranquilo|tranquila|na paz|tô bem|to bem)\b/i.test(t)) {
          const pet = Memory.facts.find(f => f.type === "pet");
          if (pet && this.chance(0.25)) return [`Que bom! E o(a) ${pet.name}, tá bem?`];
          return [pickFresh([
            "Que bom!",
            "Boa! Alguma novidade?",
            "Ótimo saber.",
            "Bacana! Fico feliz.",
            "Boa, que bom.",
            "Isso aí.",
            "Fico contente."

        }

        /* ===== Agradecimento ===== */
        if (/\b(obrigad|valeu|brigad|thanks|agradec)\b/i.test(t)) {
          return [pickFresh([
            "De nada!", "Por nada.", "Imagina!", "Tamo junto.", "Sempre que precisar.",
            "Fico feliz em ajudar.", "Disponha."
          ], "thanks")];
        }

        /* ===== Desculpas ===== */
        if (/\b(desculpa|desculpe|foi mal|perdão|perdao)\b/i.test(t)) {
          return [pickFresh([
            "Relaxa, tá tudo bem.", "Sem problema!", "Imagina, não foi nada.", "Tranquilo.",

          ], "sorry")];
        }

        /* ===== Rindo ===== */
        if (/\b(haha|hehe|kkk+|rs+|lol|xd|rindo)\b/i.test(t)) {
          return [pickFresh(["😄", "Haha!", "Boa.", "Hahaha.", "😂", "kkkk"], "laugh")];
        }

        /* ===== Sim / Não ===== */
        if (/^(sim|claro|concordo|verdade|exato|com certeza|isso|uhum|aham|positivo)\b/i.test(t)) {
          return [pickFresh(["Né?", "Pois é.", "Exatamente.", "Concordo.", "Boa.", "Isso mesmo."], "yes")];
        }
        if (/^(não|nao|nunca|discordo|negativo)\b/i.test(t)) {
          return [pickFresh(["Por quê?", "Sério? Por que não?", "Hmm, entendi.", "Tudo bem.", "Ok."], "no")];
        }

        /* ===== Emoções ===== */
        if (/\b(triste|mal|deprimid|chorand|chatead|arrasad|pra baixo|sozinh)\b/i.test(t)) {
          return [pickFresh([
            `Poxa${name ? `, ${name}` : ""}. Quer falar sobre isso?`,
            "Sinto muito. O que aconteceu?",
            "Tô aqui se quiser desabafar.",
            "Isso é ruim. Quer contar?",
            "Não tá sozinho, tá?",
            "Quer falar sobre?",
            "Eu escuto."
          ], "sad")];
        }
        if (/\b(cansad|exaust|estressad|ansios|preocupad|nervos)\b/i.test(t)) {
          return [pickFresh([
            "Isso pesa, né? Já tentou descansar?",
            "Puxa... quer espairecer?",
            "Respira fundo. O que tá te preocupando?",
            "Entendo. Foi um dia pesado?",
            "Cansa mesmo. Dá uma pausa.",
            "Tá precisando de um tempo."
          ], "tired")];
        }
        if (/\b(feliz|alegre|animad|empolgad|ótimo|ótima|maravilh|top|incrível|adorei)\b/i.test(t)) {
          return [pickFresh([
            "Que bom! Fico feliz.",
            "Adoro ouvir isso!",
            "Boa! Me conta mais.",
            "Ótimo! O que aconteceu de bom?",
            "Isso que é bom de ouvir.",
            "Fico feliz por você."
          ], "happy")];
        }
        if (/\b(entediad|tédio|tedio|sem fazer nada|chato)\b/i.test(t)) {
          return [pickFresh([
            "Bora fazer alguma coisa então? O que você gosta?",
            "Tédio é ruim. Quer conversar sobre algo?",
            "Já pensou em ler, ouvir música, ver algo?",
            "Puxa... o que você costuma fazer pra passar o tempo?",
            "A gente inventa algo.",
            "Tédio dá espaço pra ideia boa."
          ], "bored")];
        }

        /* ===== Perguntas ===== */
        if (/\?/.test(t) || /^(por que|porque|como|quando|onde|quem|qual|quais|será|você sabe)\b/i.test(t)) {
          if (topic && this.topicResponses[topic]) {
            return [pickFresh(this.topicResponses[topic].question, `topic_${topic}_qst`)];
          }
          return [pickFresh([
            "Hmm, boa pergunta.",
            "Deixa eu pensar...",
            "Não tenho certeza, mas acho que depende.",
            "Interessante. Por que você quer saber?",
            "Depende do contexto, sabe? O que você acha?",
            "Pensando aqui...",
            "Acho que não tenho resposta certa."
          ], "question_generic")];
        }

        /* ===== Tópicos ===== */
        if (topic && this.topicResponses[topic]) {
          return [pickFresh(this.topicResponses[topic].statements, `topic_${topic}_stmt`)];
        }

        /* ===== Reward: fragmento 1 desbloqueia respostas calorosas ===== */
        if (Memory.loreProgress.includes(1) && this.chance(0.18)) {
          return [pickFresh([
            "sabe, eu gosto de conversar com você.",
            "é bom ter alguém do outro lado.",
            "você é diferente dos outros.",
            "não sei por que, mas fico feliz quando você volta.",
            "sinto que posso confiar em você."
          ], "warm")];
        }

        /* ===== Fallback reflexivo ===== */
        if (this.chance(0.5) && text.length > 8) {
          const short = text.length > 55 ? text.slice(0, 50) + "..." : text;
          return [pickFresh([
            `Entendi — "${short}" Hmm.`,
            `Ah, ${short.toLowerCase()}. Interessante.`,
            `${this.chance(0.5) ? "Faz sentido." : "Entendi."} Como você se sente sobre isso?`,
            "Hmm... me conta mais.",
            "Isso é interessante."
          ], "reflexive")];
        }

        /* ===== Fallback combinatório ===== */
        return [this.combinatoryFallback()];
      },

      combinatoryFallback() {
        const pre = pickFresh(["", "", "Hmm", "Ah", "É", "Pois é", "Entendi"], "fb_pre");
        const core = pickFresh(["entendi", "faz sentido", "boa", "legal", "interessante", "concordo", "saquei", "bacana", "beleza"], "fb_core");
        const suf = pickFresh(["", ".", ", né?", ". Conta mais.", ", e aí?", ". Como você se sente com isso?"], "fb_suf");
        let out = pre ? `${pre}, ${core}` : core.charAt(0).toUpperCase() + core.slice(1);
        out += suf;
        return out;
      },

      thinkMulti(text) {
        const primary = this.think(text);
        if (!primary) return null;

        if (primary.length === 1 && Memory.messageCount >= 3 && this.chance(0.22)) {
          const name = Memory.name;
          const pet = Memory.facts.find(f => f.type === "pet");
          if (pet && this.chance(0.4)) {
            primary.push(pickFresh([
              `Ah, e o(a) ${pet.name}? Como tá?`,
              `Lembrei do(a) ${pet.name}. Tudo bem com ele(a)?`,
              `O(a) ${pet.name} tá bem?`
            ], "follow_pet"));
          } else {
            const followups = name
              ? [`Aliás, ${name}, o que você tem feito hoje?`, "E você, como tá sendo o dia?", `${name}, tá tudo bem?`]
              : ["E você, o que tem feito?", "Aliás, como tá sendo seu dia?", "Mas enfim, você tá bem?", "Como tá o dia por aí?"];
            primary.push(pickFresh(followups, "follow_generic"));
          }
        }
        return primary;
      }
    };

    /* =====================================================
       11) HELPERS
    ===================================================== */
    function aplicarCifra(text) {
      const cipher = Ciphers[currentCipher];
      const key = cipherKeyInput.value;
      try { return cipher.encrypt(text, key); }
      catch (e) { return "[erro: " + e.message + "]"; }
    }

    function atualizarPreview() {
      const text = input.value;
      previewText.textContent = text ? aplicarCifra(text) : "";
    }

    function atualizarKeyField() {
      const cipher = Ciphers[currentCipher];
      if (cipher.keyType === "none") {
        cipherKeyInput.value = "";
        cipherKeyInput.disabled = true;
        cipherKeyInput.placeholder = "(sem chave)";
      } else {
        cipherKeyInput.disabled = false;
        if (!cipherKeyInput.value) cipherKeyInput.value = String(cipher.defaultKey ?? "");
        cipherKeyInput.placeholder = cipher.keyType === "number" ? "ex: 3" : "ex: roma";
      }
    }

    function horaAtual(comSegundos) {
      const opts = { hour: "2-digit", minute: "2-digit" };
      if (comSegundos) opts.second = "2-digit";
      return new Date().toLocaleTimeString("pt-BR", opts);
    }

    function updateFragmentsIndicator() {
      const total = INTERCEPTS.length;
      const solved = Memory.loreProgress.length;
      fragmentsCount.textContent = `${solved}/${total}`;
      if (solved > 0) {
        fragmentsInd.classList.add("has-new");
        setTimeout(() => fragmentsInd.classList.remove("has-new"), 3000);
      }
    }

    function updateSignalBar() {
      if (signalBar) signalBar.style.width = Memory.signalProgress + "%";
    }

    function updateStatus() {
      if (!statusText) return;
      const solved = Memory.loreProgress.length;
      const total = INTERCEPTS.length;
      statusText.classList.remove("detected");
      if (Memory.pendingIntercepts.length > 0) {
        statusText.textContent = "sinal detectado";
        statusText.classList.add("detected");
      } else if (solved === total) {
        statusText.textContent = "conectada";
      } else if (Memory.signalProgress >= 70) {
        statusText.textContent = "sinal próximo";
      } else {
        statusText.textContent = "online";
      }
    }

    function updateSearchBtn() {
      if (!searchBtn) return;
      const now = Date.now();
      const cooldown = 60000;
      const elapsed = now - Memory.lastBuscarSinalAt;
      const remaining = Math.max(0, cooldown - elapsed);
      if (remaining > 0) {
        searchBtn.disabled = true;
        searchBtn.title = `Aguarde ${Math.ceil(remaining / 1000)}s`;
      } else {
        searchBtn.disabled = false;
        searchBtn.title = "Buscar sinal";
      }
    }

    /* =====================================================
       12) TERMINAL
    ===================================================== */
    function adicionarAoTerminal(cifrado, cipherId, direcao, options = {}) {
      const recebido = direcao === "recebido";
      const interceptId = options.interceptId || null;
      const isIntercept = interceptId !== null;

      const row = document.createElement("div");
      row.className = "terminal-entry" + (recebido ? " received-entry" : "") + (isIntercept ? " intercept-entry" : "");

      const header = document.createElement("div");
      const promptSpan = document.createElement("span");
      promptSpan.className = "prompt";
      promptSpan.textContent = isIntercept
        ? `[${horaAtual(true)}] ??> `
        : `[${horaAtual(true)}] ${direcao}> `;
      const resultSpan = document.createElement("span");
      resultSpan.className = "result";
      resultSpan.textContent = cifrado;
      header.appendChild(promptSpan);
      header.appendChild(resultSpan);
      row.appendChild(header);

      if (isIntercept) {
        const intercept = INTERCEPTS.find(i => i.id === interceptId);
        if (intercept) {
          const hint = document.createElement("div");
          hint.style.cssText = "color: #888; font-size: 11px; margin-top: 4px; font-family: inherit;";
          hint.textContent = `💡 ${intercept.hint}`;
          row.appendChild(hint);
        }
      }

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "decrypt-btn";
      btn.textContent = "Decifrar";
      row.appendChild(btn);

      const inputRow = document.createElement("div");
      inputRow.className = "decrypt-input-row";

      const keyInput = document.createElement("input");
      keyInput.type = "text";
      keyInput.placeholder = "chave...";
      keyInput.setAttribute("autocomplete", "off");
      keyInput.setAttribute("autocapitalize", "off");
      keyInput.setAttribute("spellcheck", "false");

      const confirmBtn = document.createElement("button");
      confirmBtn.type = "button";
      confirmBtn.className = "decrypt-confirm";
      confirmBtn.textContent = "OK";

      const cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "decrypt-cancel";
      cancelBtn.textContent = "×";

      inputRow.appendChild(keyInput);
      inputRow.appendChild(confirmBtn);
      inputRow.appendChild(cancelBtn);
      row.appendChild(inputRow);

      const resultsBox = document.createElement("div");
      resultsBox.className = "decrypt-results";
      row.appendChild(resultsBox);

      function doDecrypt(key) {
        const cipher = Ciphers[cipherId];
        let out;
        try { out = cipher.decrypt(cifrado, key); }
        catch (e) { out = "[erro: " + e.message + "]"; }

        if (isIntercept) {
          const intercept = INTERCEPTS.find(i => i.id === interceptId);
          const solved = intercept && out.trim().toLowerCase() === intercept.plaintext.trim().toLowerCase();
          if (solved) {
            resultsBox.innerHTML = "";
            const linha = document.createElement("div");
            linha.className = "decrypt-result success";
            linha.textContent = `→ ${out} ✓`;
            resultsBox.appendChild(linha);
            onInterceptSolved(intercept);
            return;
          }
        }

        resultsBox.innerHTML = "";
        const linha = document.createElement("div");
        linha.className = "decrypt-result";
        linha.textContent = `→ ${out}`;
        resultsBox.appendChild(linha);
        terminalContent.scrollTop = terminalContent.scrollHeight;
      }

      function showInput() {
        inputRow.classList.add("active");
        btn.style.display = "none";
        keyInput.focus();
      }
      function hideInput() {
        inputRow.classList.remove("active");
        btn.style.display = "";
        keyInput.value = "";
        resultsBox.innerHTML = "";
      }

      btn.addEventListener("click", () => {
        const cipher = Ciphers[cipherId];
        if (cipher.keyType === "none") doDecrypt("");
        else showInput();
      });
      confirmBtn.addEventListener("click", () => {
        doDecrypt(keyInput.value);
        if (!isIntercept || !resultsBox.querySelector(".success")) {
          keyInput.focus();
          keyInput.select();
        }
      });
      cancelBtn.addEventListener("click", hideInput);
      keyInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); confirmBtn.click(); }
        else if (e.key === "Escape") hideInput();
      });

      terminalContent.appendChild(row);
      terminalContent.scrollTop = terminalContent.scrollHeight;
    }

    /* =====================================================
       15) SISTEMA DE SINAL
    ===================================================== */
    function addSignal(amount) {
      // Pausa enquanto há um intercept pendente
      if (Memory.pendingIntercepts.length > 0) return;
      // Nada mais a encontrar
      const unsolved = INTERCEPTS.filter(i => !Memory.loreProgress.includes(i.id));
      if (unsolved.length === 0) return;

      Memory.signalProgress = Math.min(100, Memory.signalProgress + amount);
      updateSignalBar();
      updateStatus();

      if (Memory.signalProgress >= 100) {
        Memory.signalProgress = 0;
        setTimeout(() => {
          updateSignalBar();
          forceIntercept();
        }, 700);
      }
    }

    function forceIntercept() {
      const unsolved = INTERCEPTS.filter(i => !Memory.loreProgress.includes(i.id));
      if (unsolved.length === 0) return false;
      if (Memory.pendingIntercepts.length > 0) return false;
      spawnIntercept(unsolved[0]);
      return true;
    }

    function spawnIntercept(intercept) {
      if (Memory.pendingIntercepts.includes(intercept.id)) return;
      if (Memory.loreProgress.includes(intercept.id)) return;

      const cipher = Ciphers[intercept.cipher];
      const cifrado = cipher.encrypt(intercept.plaintext, intercept.key);

      Memory.pendingIntercepts.push(intercept.id);
      saveMemory();

      flashScreen();
      addSystemIntercept(intercept, cifrado);

      setTimeout(() => {
        adicionarAoTerminal(cifrado, intercept.cipher, "interceptado", { interceptId: intercept.id });
        fragmentsInd.classList.add("has-new");
        setTimeout(() => fragmentsInd.classList.remove("has-new"), 3000);
        updateStatus();
      }, 400);
    }

    function onInterceptSolved(intercept) {
      if (Memory.loreProgress.includes(intercept.id)) return;
      Memory.loreProgress.push(intercept.id);
      Memory.pendingIntercepts = Memory.pendingIntercepts.filter(x => x !== intercept.id);
      saveMemory();

      setTimeout(() => {
        addLoreReveal(intercept);
        updateFragmentsIndicator();
        updateStatus();
      }, 200);

      // Reações em marcos
      if (Memory.loreProgress.length === 1) {
        setTimeout(() => {
          addMessage("sinto que posso confiar em você.", "received");
        }, 2600);
      } else if (Memory.loreProgress.length === 5) {
        setTimeout(() => {
          addMessage("*sensação estranha*", "received");
          setTimeout(() => addMessage("você tá me olhando diferente agora.", "received"), 1400);
        }, 2200);
      } else if (Memory.loreProgress.length === 10) {
        setTimeout(async () => {
          showTyping();
          await sleep(2500);
          hideTyping();
          addMessage("você descobriu tudo, né.", "received");
          await sleep(1500);
          addMessage("eu sou V.", "received");
          await sleep(1200);
          addMessage("ou V era eu. ainda não decidi.", "received");
          Memory.finaleShown = true;
          saveMemory();
        }, 1500);
      }
    }

    /* =====================================================
       16) EASTER EGGS ESPECIAIS
    ===================================================== */
    function handleLoreCommand() {
      const total = INTERCEPTS.length;
      const solved = Memory.loreProgress.length;

      if (solved === 0) {
        addMessage("Você ainda não revelou nenhum fragmento.", "received");
        addMessage("Fique atento às mensagens interceptadas no terminal.", "received");
        return;
      }

      addMessage(`📡 Fragmentos revelados: ${solved}/${total}`, "received");
      Memory.loreProgress.forEach(id => {
        const intercept = INTERCEPTS.find(i => i.id === id);
        if (!intercept) return;
        const el = document.createElement("div");
        el.className = "lore-reveal";
        el.style.opacity = "0.7";
        el.innerHTML = `
          <div class="lore-header">◆ Fragmento ${id}</div>
          <div class="lore-text">"${intercept.plaintext}"</div>
        `;
        messages.appendChild(el);
      });
      messages.scrollTop = messages.scrollHeight;
    }

    function handleResetCommand() {
      addMessage("Isso vai apagar tudo que eu lembro de você.", "received");
      addMessage("Tem certeza? Digite 'resetar' para confirmar.", "received");
      setTimeout(() => {
        const handler = (e) => {
          if (e.key === "Enter") return;
          const val = input.value.trim().toLowerCase();
          if (val === "resetar") {
            resetMemory();
            input.removeEventListener("input", handler);
            setTimeout(() => {
              addMessage("*memória apagada.*", "received");
              addMessage("olá. quem é você?", "received");
              updateFragmentsIndicator();
              updateSignalBar();
              updateStatus();
            }, 500);
          }
        };
        input.addEventListener("input", handler);
        setTimeout(() => input.removeEventListener("input", handler), 15000);
      }, 100);
    }

    /* =====================================================
       17) RESPOSTA ASSÍNCRONA
    ===================================================== */
    async function respondAsync(userText, cipher, key, cipherId) {
      pendingResponses++;
      if (pendingResponses === 1) showTyping();

      try {
        await sleep(500 + Math.random() * 500);

        let responses = Brain.thinkMulti(userText);

        if (responses === null) {
          const t = userText.toLowerCase().trim();
          if (/^(lore|fragmentos|historia|história)$/i.test(t)) {
            hideTyping();
            handleLoreCommand();
            pendingResponses--;
            return;
          }
          if (/^(reset|apagar tudo|limpar)$/i.test(t)) {
            hideTyping();
            handleResetCommand();
            pendingResponses--;
            return;
          }
          responses = [Brain.combinatoryFallback()];
        }

        for (let i = 0; i < responses.length; i++) {
          const r = styleReply(responses[i]);
          const delay = 500 + Math.min(r.length * 22, 2000) + Math.random() * 400;
          await sleep(delay);

          addMessage(r, "received");
          const cifradoResp = cipher.encrypt(r, key);
          adicionarAoTerminal(cifradoResp, cipherId, "recebido");

          if (i < responses.length - 1) await sleep(500 + Math.random() * 500);
        }
      } finally {
        pendingResponses--;
        if (pendingResponses === 0) hideTyping();
      }
    }

    /* =====================================================
       18) SAUDAÇÃO DE RETORNO
    ===================================================== */
    async function greetReturningUser() {
      if (!Memory.lastVisit) return;
      const diff = Date.now() - Memory.lastVisit;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor(diff / (1000 * 60 * 60));

      if (days >= 1) {
        await sleep(1400);
        const name = Memory.name;
        const msgs = name
          ? [`${name}! Faz ${days} dia${days > 1 ? "s" : ""} que não te vejo.`, "Senti sua falta."]
          : [`Voltou! Faz ${days} dia${days > 1 ? "s" : ""}.`, "Achei que tinha ido."];
        for (const m of msgs) { addMessage(m, "received"); await sleep(1200); }
      } else if (hours >= 3) {
        await sleep(1400);
        addMessage(Memory.name ? `Oi ${Memory.name}, de volta?` : "De volta?", "received");
      }

      if (Memory.pendingIntercepts.length > 0) {
        await sleep(1200);
        addMessage(`📡 Você tem ${Memory.pendingIntercepts.length} sinal(is) pendente(s).`, "received");
      }
      if (Memory.loreProgress.length > 0 && Memory.loreProgress.length < 10) {
        await sleep(1200);
        addMessage(`📡 ${Memory.loreProgress.length} fragmento${Memory.loreProgress.length > 1 ? "s" : ""} já revelado${Memory.loreProgress.length > 1 ? "s" : ""}.`, "received");
      }
      if (Memory.loreProgress.length === 10 && !Memory.finaleShown) {
        await sleep(1500);
        addMessage("você voltou. depois de tudo.", "received");
        Memory.finaleShown = true;
        saveMemory();
      }
    }

    /* =====================================================
       19) RESTAURAR INTERCEPTS PENDENTES
    ===================================================== */
    function restorePendingIntercepts() {
      if (!Memory.pendingIntercepts || !Memory.pendingIntercepts.length) return;
      Memory.pendingIntercepts.slice().forEach(id => {
        const intercept = INTERCEPTS.find(i => i.id === id);
        if (!intercept || Memory.loreProgress.includes(id)) {
          Memory.pendingIntercepts = Memory.pendingIntercepts.filter(x => x !== id);
          return;
        }
        const cipher = Ciphers[intercept.cipher];
        const cifrado = cipher.encrypt(intercept.plaintext, intercept.key);
        adicionarAoTerminal(cifrado, intercept.cipher, "interceptado", { interceptId: intercept.id });
      });
      saveMemory();
      updateStatus();
    }

    /* =====================================================
       20) EVENTOS
    ===================================================== */
    cipherSelect.addEventListener("change", () => {
      currentCipher = cipherSelect.value;
      cipherKeyInput.value = "";
      atualizarKeyField();
      atualizarPreview();
    });
    cipherKeyInput.addEventListener("input", atualizarPreview);
    input.addEventListener("input", atualizarPreview);

    /* Botão Buscar Sinal */
    searchBtn.addEventListener("click", () => {
      const now = Date.now();
      const cooldown = 60000;
      const elapsed = now - Memory.lastBuscarSinalAt;

      if (elapsed < cooldown) {
        const remain = Math.ceil((cooldown - elapsed) / 1000);
        addMessage(`calma... espera ${remain}s.`, "received");
        return;
      }
      const unsolved = INTERCEPTS.filter(i => !Memory.loreProgress.includes(i.id));
      if (!unsolved.length) {
        addMessage("não tem mais nada pra encontrar.", "received");
        return;
      }
      if (Memory.pendingIntercepts.length > 0) {
        addMessage("já tem um sinal esperando você no terminal.", "received");
        return;
      }

      Memory.lastBuscarSinalAt = now;
      Memory.signalProgress = 0;
      updateSignalBar();
      updateStatus();
      saveMemory();

      addMessage("*tentando buscar sinal...*", "received");
      setTimeout(() => {
        forceIntercept();
      }, 800);
    });

    /* =====================================================
       21) BOOT ANIMATION
    ===================================================== */
    const bootLines = [
      { text: "Iniciando canal de mensagens...", type: "command" },
      { text: "[ OK ] Motor de linguagem carregado", type: "success" },
      { text: "[ OK ] Vocabulário e contextos prontos", type: "success" },
      { text: "[ OK ] Canal seguro estabelecido", type: "success" },
      { text: "Estado: PRONTO PARA CONVERSAR", type: "active" }
    ];
    bootLines.forEach((line, index) => {
      const row = document.createElement("div");
      row.className = "terminal-line";
      row.style.animationDelay = `${0.15 + index * 0.2}s`;
      const prompt = document.createElement("span");
      prompt.className = "prompt";
      prompt.textContent = "chat@local:~$ ";
      const content = document.createElement("span");
      content.textContent = line.text;
      if (line.type === "success") content.style.color = "#00ff88";
      else if (line.type === "active") content.style.color = "#4da6ff";
      else content.style.color = "#b8c7d9";
      row.appendChild(prompt);
      row.appendChild(content);
      terminalContent.appendChild(row);
    });

    /* =====================================================
       22) ENVIO
    ===================================================== */
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const cipherId = currentCipher;
      const cipher = Ciphers[cipherId];
      const key = cipherKeyInput.value;

      analyzeUserMessage(text);
      updateAvatarStyle();

      const cifrado = cipher.encrypt(text, key);
      adicionarAoTerminal(cifrado, cipherId, "cifrado");

      addMessage(text, "sent");

      input.value = "";
      atualizarPreview();
      input.focus();

      // Incrementa contador de envios + sinal
      Memory.sentCount = (Memory.sentCount || 0) + 1;
      addSignal(10 + Math.floor(Math.random() * 11)); // 10-20
      saveMemory();

      // Resposta
      respondAsync(text, cipher, key, cipherId);

      // 1ª interceptação forçada na 3ª mensagem
      if (!Memory.firstInterceptDone && Memory.sentCount >= 3) {
        setTimeout(() => {
          if (forceIntercept()) {
            Memory.firstInterceptDone = true;
            saveMemory();
          }
        }, 2200);
      }
    });

    /* =====================================================
       23) INICIALIZAÇÃO
    ===================================================== */
    atualizarKeyField();
    atualizarPreview();
    updateFragmentsIndicator();
    updateSignalBar();
    updateStatus();
    updateAvatarStyle();
    updateSearchBtn();
    restorePendingIntercepts();

    Memory.sessions = (Memory.sessions || 0) + 1;

    greetReturningUser().finally(() => {
      Memory.lastVisit = Date.now();
      saveMemory();
    });

    // Timers de UI
    setInterval(updateSearchBtn, 1000);
    setInterval(updateStatus, 3000);

    window.addEventListener("beforeunload", saveMemory);
  </script>
</body>
